<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Job Pilot — local job-search cockpit</title>
<style>
  :root{
    --bg:#f7f8fa; --surface:#ffffff; --sunken:#f1f3f6; --line:#e5e7eb; --line-2:#d3d7de;
    --text:#1b1f27; --muted:#5d6470; --faint:#8a919e;
    --accent:#3355e0; --accent-weak:#eef1fd; --accent-text:#2a45c0;
    --good:#1a7f47; --warn:#8a5a00; --bad:#b42318;
    --radius:12px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --shadow-lg:0 16px 48px rgba(16,24,40,.16);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1116; --surface:#161922; --sunken:#1c2029; --line:#272c38; --line-2:#39404e;
      --text:#e7e9ee; --muted:#a3aab8; --faint:#7b8291;
      --accent:#7d9bff; --accent-weak:#1b2337; --accent-text:#adc2ff;
      --good:#5ccb87; --warn:#e0b341; --bad:#f2786c;
      --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 48px rgba(0,0,0,.6);
    }
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font:14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased; }
  a{ color:var(--accent-text); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  h1,h2,h3{ letter-spacing:-.01em; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  [hidden]{ display:none !important; }

  /* controls */
  button{ font:inherit; cursor:pointer; }
  .btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-2); background:var(--surface);
    color:var(--text); border-radius:var(--radius-sm); padding:6px 11px; font-weight:500; transition:background .12s, border-color .12s; }
  .btn:hover{ border-color:var(--faint); }
  .btn-primary{ background:var(--accent); border-color:transparent; color:#fff; font-weight:600; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--muted); }
  .btn-ghost:hover{ background:var(--sunken); color:var(--text); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn-sm{ padding:4px 8px; font-size:12.5px; }
  input, select, textarea{ font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line-2);
    border-radius:var(--radius-sm); padding:6px 9px; outline:none; max-width:100%; }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); }
  textarea{ resize:vertical; width:100%; }

  /* shell */
  .wrap{ max-width:1080px; margin:0 auto; padding:0 16px; }
  header.top{ position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .bar{ display:flex; align-items:center; gap:10px; padding:10px 0; flex-wrap:wrap; }
  .brand{ font-weight:750; font-size:15px; letter-spacing:-.01em; }
  .brand span{ color:var(--faint); font-weight:500; }
  .spacer{ flex:1 1 auto; }
  .status{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
  .dot.on{ background:var(--good); } .dot.off{ background:var(--bad); }

  nav.tabs{ display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab{ display:inline-flex; align-items:center; gap:7px; background:transparent; border:0; border-bottom:2px solid transparent;
    color:var(--muted); padding:8px 11px; font-weight:500; white-space:nowrap; }
  .tab:hover{ color:var(--text); }
  .tab[aria-current="true"]{ color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  .tab .n{ font-size:11.5px; color:var(--faint); background:var(--sunken); border-radius:999px; padding:0 6px; min-width:18px; text-align:center; }
  .tab[aria-current="true"] .n{ color:var(--accent-text); background:var(--accent-weak); }

  main{ padding:18px 0 72px; }
  .sechead{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:2px 0 12px; }
  .sechead h1{ font-size:17px; margin:0; font-weight:680; }
  .sechead p{ margin:0; color:var(--faint); font-size:12.5px; max-width:74ch; }
  .toolbar{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .spread{ display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap; }

  details.filters{ border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin-bottom:14px; }
  details.filters > summary{ cursor:pointer; list-style:none; padding:9px 12px; font-size:12.5px; color:var(--muted); font-weight:600; }
  details.filters > summary::-webkit-details-marker{ display:none; }
  .filtergrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; padding:0 12px 12px; }
  .filtergrid label{ display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--faint); }
  .filtergrid label.wide{ grid-column:1/-1; }

  ul.list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .item{ display:grid; grid-template-columns:auto 1fr auto; gap:10px 12px; align-items:start; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; }
  .item:hover{ border-color:var(--line-2); }
  .item.dim{ opacity:.72; }
  .mark{ width:8px; height:8px; border-radius:50%; margin-top:6px; background:var(--faint); }
  .mark.suitable{ background:var(--good); } .mark.review{ background:var(--warn); } .mark.excluded{ background:var(--bad); }
  .ititle{ font-size:14.5px; font-weight:620; margin:0 0 2px; }
  .ititle button{ all:unset; cursor:pointer; color:inherit; font:inherit; }
  .ititle button:hover{ color:var(--accent-text); }
  .imeta{ color:var(--muted); font-size:12.5px; display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .imeta .sep{ color:var(--line-2); }
  .ireasons{ margin-top:5px; font-size:12px; color:var(--faint); }
  .ireasons .ex{ color:var(--bad); } .ireasons .rv{ color:var(--warn); }
  .iactions{ display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  .pill{ font-size:11.5px; padding:1px 8px; border-radius:999px; background:var(--sunken); color:var(--muted); white-space:nowrap; }
  .pill.fit{ color:var(--accent-text); background:var(--accent-weak); font-weight:600; }
  .pill.good{ color:var(--good); } .pill.warn{ color:var(--warn); } .pill.bad{ color:var(--bad); }
  .empty{ text-align:center; color:var(--muted); padding:44px 20px; background:var(--surface); border:1px dashed var(--line-2); border-radius:var(--radius); }
  .empty h3{ margin:0 0 4px; font-size:14.5px; color:var(--text); }
  .empty .row{ justify-content:center; margin-top:12px; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:8px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:11px 13px; }
  .card h3{ margin:0 0 2px; font-size:14px; font-weight:640; }
  .card .sub{ color:var(--muted); font-size:12.5px; }
  .kv{ display:grid; grid-template-columns:112px 1fr; gap:3px 10px; font-size:12.5px; margin:8px 0 0; }
  .kv dt{ color:var(--faint); } .kv dd{ margin:0; overflow-wrap:anywhere; }
  .card .actions{ display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; justify-content:flex-end; }
  .mono{ font:12px ui-monospace, SFMono-Regular, Menlo, monospace; word-break:break-all; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  /* drawer + modal */
  .overlay{ position:fixed; inset:0; background:rgba(16,24,40,.34); opacity:0; pointer-events:none; transition:opacity .16s; z-index:40; }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .drawer{ position:fixed; top:0; right:0; bottom:0; width:min(620px,96vw); background:var(--surface); border-left:1px solid var(--line);
    z-index:50; transform:translateX(102%); transition:transform .18s ease; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); }
  .drawer.open{ transform:none; }
  .dhead{ display:flex; align-items:center; gap:10px; padding:12px 15px; border-bottom:1px solid var(--line); }
  .dhead .t{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); }
  .dbody{ overflow:auto; padding:15px; flex:1; }
  .dbody h2{ font-size:18px; margin:0 0 6px; }
  .dbody h3{ font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); margin:20px 0 7px; }
  .dbody pre{ white-space:pre-wrap; word-break:break-word; font:12.5px/1.6 ui-monospace, Menlo, monospace; color:var(--muted);
    background:var(--sunken); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px; margin:0; max-height:340px; overflow:auto; }
  .dbody img{ max-width:100%; border:1px solid var(--line); border-radius:var(--radius-sm); }
  .modal{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:min(700px,94vw); max-height:88vh; background:var(--surface);
    border:1px solid var(--line-2); border-radius:var(--radius); box-shadow:var(--shadow-lg); z-index:60; display:flex; flex-direction:column; }
  #modalOverlay{ z-index:55; }
  .mhead{ display:flex; align-items:center; gap:10px; padding:12px 15px; border-bottom:1px solid var(--line); }
  .mhead h2{ font-size:15px; margin:0; }
  .mbody{ overflow:auto; padding:15px; }
  .mfoot{ display:flex; gap:8px; justify-content:flex-end; padding:11px 15px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .mbody p{ margin:0 0 10px; font-size:13px; }
  .mbody label{ display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  table.pv{ border-collapse:collapse; width:100%; font-size:12px; }
  table.pv th, table.pv td{ border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; }
  table.pv th{ color:var(--faint); font-weight:600; }
  .note{ font-size:12.5px; color:var(--muted); }
  .banner{ border-radius:var(--radius-sm); padding:9px 11px; font-size:12.5px; margin:0 0 12px; }
  .banner.warn{ background:color-mix(in srgb, var(--warn) 14%, transparent); color:var(--warn); }
  .banner.bad{ background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad); }
  .banner.ok{ background:color-mix(in srgb, var(--good) 12%, transparent); color:var(--good); }
  .step{ display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line); }
  .step:last-child{ border-bottom:0; }
  .step .st{ flex:none; font-size:11px; width:66px; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; padding-top:2px; }
  .toasts{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:6px; width:min(520px,92vw); }
  .toast{ background:var(--surface); border:1px solid var(--line-2); padding:9px 13px; border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); font-size:13px; }
  .spin{ display:inline-block; width:12px; height:12px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .cap{ display:flex; align-items:center; gap:8px; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }
  .cap:last-child{ border-bottom:0; }
  .cap .cstate{ font-size:11.5px; color:var(--faint); }

  @media (max-width:520px){
    .wrap{ padding:0 11px; }
    .item{ grid-template-columns:auto 1fr; }
    .iactions{ grid-column:1/-1; justify-content:flex-start; }
    .grid2{ grid-template-columns:1fr; }
    .bar .toolbar{ width:100%; }
    .bar .toolbar .btn{ flex:1 1 auto; justify-content:center; }
    .filtergrid{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">Job Pilot <span>· local cockpit</span></div>
      <span class="status" id="connStatus"><span class="dot off" id="connDot"></span><span id="connText">connecting…</span></span>
      <span class="spacer"></span>
      <div class="toolbar" id="topActions"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="dhead"><span class="t" id="drawerKind">Details</span><span class="spacer"></span>
    <button class="btn btn-ghost btn-sm" id="drawerClose" aria-label="Close">Close ✕</button></div>
  <div class="dbody" id="drawerBody"></div>
</aside>

<div class="overlay" id="modalOverlay" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="mhead"><h2 id="modalTitle"></h2><span class="spacer"></span>
    <button class="btn btn-ghost btn-sm" id="modalClose" aria-label="Close">✕</button></div>
  <div class="mbody" id="modalBody"></div>
  <div class="mfoot" id="modalFoot"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module">
'use strict';
/* ---------------------------------------------------------------- utilities */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const cap = (s) => String(s || '').replace(/\b\w/g, (c) => c.toUpperCase());
const ago = (iso) => {
  if (!iso) return '—';
  const d = (Date.now() - new Date(iso).getTime()) / 86400000;
  if (!isFinite(d)) return '—';
  if (d < 1/24) return Math.max(1, Math.round(d * 1440)) + 'm ago';
  if (d < 1) return Math.round(d * 24) + 'h ago';
  if (d < 30) return Math.round(d) + 'd ago';
  return new Date(iso).toLocaleDateString();
};
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  const ct = r.headers.get('content-type') || '';
  const body = ct.includes('json') ? await r.json().catch(() => ({})) : await r.text();
  if (!r.ok) throw new Error((body && body.error) || (r.status + ' ' + r.statusText));
  return body;
}
let toastTimers = [];
function toast(msg, ms = 4200) {
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = msg;
  $('#toasts').appendChild(el);
  toastTimers.push(setTimeout(() => el.remove(), ms));
  if (toastTimers.length > 6) toastTimers = toastTimers.slice(-6);
}
function openModal({ title, body, actions = [] }) {
  $('#modalTitle').textContent = title || '';
  $('#modalBody').innerHTML = body || '';
  const foot = $('#modalFoot'); foot.innerHTML = '';
  for (const a of actions) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (a.primary ? ' btn-primary' : '');
    b.textContent = a.label; b.onclick = a.onClick; foot.appendChild(b);
  }
  $('#modal').hidden = false; $('#modalOverlay').hidden = false;
  requestAnimationFrame(() => $('#modalOverlay').classList.add('show'));
  $('#modalClose').focus();
}
function closeModal() { const m = $('#modal'); if (!m || m.hidden) return; m.hidden = true; const o = $('#modalOverlay'); o.classList.remove('show'); setTimeout(() => { o.hidden = true; }, 180); }

/* --------------------------------------------------- shared classifiers */
const elig = await import('/eligibility.js');
const { classifyEligibility, BUCKET } = elig;

const state = {
  section: 'opportunities',
  tab: 'all',
  jobs: [], stats: {}, connections: null, criteria: null,
  companies: [], contacts: [], pipeline: [], research: [], sites: [],
  audit: [], filters: { q: '', bucket: '', role: '', city: '', tier: '', remote: false },
};

/* ------------------------------------------------------------ connections */
function connDotOn() {
  const c = state.connections || {};
  const on = (c.browsy && c.browsy.connected) || (c.clinqy && c.clinqy.connected)
    || (c.localBrowser && c.localBrowser.connected) || (c.extension && c.extension.connected);
  return Boolean(on);
}
function renderConnStatus() {
  const c = state.connections || {};
  const b = c.browsy || {}, cl = c.clinqy || {}, lb = c.localBrowser || {}, ex = c.extension || {};
  $('#connDot').className = 'dot ' + (connDotOn() ? 'on' : 'off');
  const parts = [];
  parts.push('Browser ' + (lb.connected ? 'engine connected' : b.connected ? 'Browsy connected' : 'offline'));
  parts.push('Clinqy ' + (cl.connected ? 'connected' : cl.available ? 'ready' : 'not found'));
  parts.push('extension ' + (ex.connected ? 'connected' : 'offline'));
  $('#connText').textContent = parts.join(' · ');
}

/* -------------------------------------------------------------------- tabs */
const TABS = [
  { id: 'opportunities', label: 'Opportunities' },
  { id: 'research', label: 'Research' },
  { id: 'pipeline', label: 'Pipeline' },
  { id: 'people', label: 'People & Companies' },
  { id: 'connections', label: 'Connections' },
];
function tabCount(id) {
  const s = state.stats || {};
  const st = s.byStatus || {};
  if (id === 'opportunities') return (st.new || 0) + (st.saved || 0);
  if (id === 'pipeline') return state.pipeline.length;
  if (id === 'people') return state.companies.length + state.contacts.length;
  if (id === 'research') return state.research.length;
  if (id === 'connections') return null;
  return null;
}
function renderTabs() {
  $('#tabs').innerHTML = TABS.map((t) => {
    const n = tabCount(t.id);
    return `<button class="tab" data-tab="${t.id}" aria-current="${state.section === t.id}">${esc(t.label)}${n == null ? '' : `<span class="n">${n}</span>`}</button>`;
  }).join('');
}

/* top actions per section */
function renderTopActions() {
  const map = {
    opportunities: [
      ['Scan sources', 'scan', 'primary'],
      ['Capture from browser', 'capture'],
      ['Export', 'export'],
      ['Digest', 'digest'],
    ],
    research: [['New research run', 'research-new', 'primary']],
    pipeline: [['Export pipeline', 'export-pipeline']],
    people: [['Export companies', 'export-companies'], ['Export contacts', 'export-contacts']],
    connections: [['Recheck connections', 'recheck', 'primary']],
  };
  const acts = map[state.section] || [];
  $('#topActions').innerHTML = acts.map(([label, act, cls]) => `<button class="btn ${cls === 'primary' ? 'btn-primary' : ''} btn-sm" data-act="${act}">${esc(label)}</button>`).join('');
}

/* ------------------------------------------------------------------- boot */
async function boot() {
  renderTabs();
  await Promise.all([refreshState(), refreshConnections(), loadCriteria(), loadCompanies(), loadContacts(), loadPipeline(), loadResearch()]);
  render();
}
async function refreshState() {
  try {
    const s = await api('/api/state');
    state.stats = s.stats || {};
    state.connections = s.connections || state.connections;
    renderConnStatus(); renderTabs();
  } catch { /* busy */ }
}
async function refreshConnections(refresh = false) {
  try {
    const c = await api('/api/connections' + (refresh ? '?refresh=1' : ''));
    state.connections = { browsy: c.browsy, clinqy: c.clinqy, localBrowser: c.localBrowser, extension: c.extension };
    state.clinqyCaps = c.clinqyCapabilities || [];
    state.audit = c.audit || [];
    renderConnStatus();
  } catch { /* busy */ }
}
async function loadCriteria() {
  try { state.criteria = (await api('/api/criteria')).criteria; } catch { /* default */ }
}
async function loadCompanies() { try { state.companies = (await api('/api/companies')).rows || []; } catch { /* */ } }
async function loadContacts() { try { state.contacts = (await api('/api/contacts')).rows || []; } catch { /* */ } }
async function loadPipeline() { try { state.pipeline = (await api('/api/pipeline')).rows || []; } catch { /* */ } }
async function loadResearch() { try { const d = await api('/api/research/runs'); state.research = d.runs || []; state.sites = d.sites || []; } catch { /* */ } }

function render() {
  renderTabs(); renderTopActions();
  const m = $('#main');
  if (state.section === 'opportunities') return renderOpportunities(m);
  if (state.section === 'research') return renderResearch(m);
  if (state.section === 'pipeline') return renderPipeline(m);
  if (state.section === 'people') return renderPeople(m);
  if (state.section === 'connections') return renderConnections(m);
}

/* ============================================================ OPPORTUNITIES */

const BUCKETS = [
  { id: 'all', label: 'All captured' },
  { id: 'suitable', label: 'Potentially suitable' },
  { id: 'review', label: 'Needs review' },
  { id: 'excluded', label: 'Excluded' },
];

async function renderOpportunities(m) {
  m.innerHTML = `
    <div class="sechead"><h1>Opportunities</h1>
      <p>Every lead captured locally, with its fit and eligibility read from the title first. Excluded roles stay visible with the reason.</p></div>
    <details class="filters" ${state.filters.q || state.filters.role || state.filters.city || state.filters.tier || state.filters.remote ? 'open' : ''}>
      <summary>Filters</summary>
      <div class="filtergrid">
        <label class="wide">Search<input type="search" id="fq" value="${esc(state.filters.q)}" placeholder="title, company, text" /></label>
        <label>Role family<select id="frole">
          <option value="">Any</option>
          ${elig.ROLE_FAMILIES.map((f) => `<option value="${f.key}" ${state.filters.role === f.key ? 'selected' : ''}>${esc(f.label)}</option>`).join('')}

        </select></label>
        <label>City<select id="fcity">
          <option value="">Any</option>
          ${['Mumbai','Pune','Bengaluru','Hyderabad','Other India','Remote (India eligible)','Restricted / outside India','Location unknown']
            .map((c, i) => `<option value="${i}" ${String(state.filters.city) === String(i) ? 'selected' : ''}>${c}</option>`).join('')}
        </select></label>
        <label>Employer<select id="ftier">
          <option value="">Any</option>
          <option value="0" ${state.filters.tier === '0' ? 'selected' : ''}>MNC / large</option>
          <option value="1" ${state.filters.tier === '1' ? 'selected' : ''}>Startup / scaleup</option>
          <option value="2" ${state.filters.tier === '2' ? 'selected' : ''}>Other</option>
        </select></label>
        <label>&nbsp;<span class="row"><input type="checkbox" id="fremote" ${state.filters.remote ? 'checked' : ''} /> remote only</span></label>
      </div>
      <div class="row" style="padding:0 12px 12px">
        <button class="btn btn-sm" id="fapply">Apply filters</button>
        <button class="btn btn-ghost btn-sm" id="fclear">Clear</button>
      </div>
    </details>
    <div class="spread" style="margin-bottom:8px">
      <div class="toolbar">
        ${BUCKETS.map((b) => `<button class="btn btn-sm ${state.tab === b.id ? 'btn-primary' : ''}" data-bucket="${b.id}">${esc(b.label)}</button>`).join('')}
      </div>
      <span class="note" id="oppCount"></span>
    </div>

  $('#fapply').onclick = () => { readFilters(); renderOpportunities(m); };
  $('#fclear').onclick = () => { state.filters = { q: '', bucket: '', role: '', city: '', tier: '', remote: false }; renderOpportunities(m); };
  $$('[data-bucket]', m).forEach((b) => b.onclick = () => { state.tab = b.dataset.bucket; renderOpportunities(m); });
  loadJobs();
}

function readFilters() {
  state.filters.q = $('#fq') ? $('#fq').value.trim() : '';
  state.filters.role = $('#frole') ? $('#frole').value : '';
  state.filters.city = $('#fcity') ? $('#fcity').value : '';
  state.filters.tier = $('#ftier') ? $('#ftier').value : '';
  state.filters.remote = $('#fremote') ? $('#fremote').checked : false;
}

async function loadJobs() {
  const f = state.filters;
  const q = new URLSearchParams();
  if (f.q) q.set('q', f.q);
  if (state.tab !== 'all') q.set('bucket', state.tab);
  q.set('limit', '500');
  try {
    const d = await api('/api/jobs?' + q.toString());
    state.jobs = d.rows || [];
    state.jobsTotal = d.total;
    renderJobList();
  } catch (e) {
    $('#oppList').innerHTML = `<li class="empty"><h3>Could not load opportunities</h3><span class="note">${esc(e.message)}</span></li>`;
  }
}

function passesFilters(j) {
  const f = state.filters;
  if (f.role && j.eligibility.fit.role.key !== f.role) return false;
  if (f.city !== '' && Number(j.eligibility.fit.city.rank) !== Number(f.city)) return false;
  if (f.tier !== '' && Number(j.eligibility.fit.tier.rank) !== Number(f.tier)) return false;
  if (f.remote && !j.remote) return false;
  return true;
}

function rankJobs(rows) {
  const order = { suitable: 0, review: 1, excluded: 2 };
  return rows.slice().sort((a, b) => {
    const A = a.eligibility, B = b.eligibility;
    return (order[A.bucket] - order[B.bucket])
      || (a.eligibility.fit.type.key === 'internship' && a.eligibility.fit.duration.stated ? -1 : 0)
        - (b.eligibility.fit.type.key === 'internship' && b.eligibility.fit.duration.stated ? -1 : 0)
      || (A.fit.city.rank - B.fit.city.rank)
      || (A.fit.tier.rank - B.fit.tier.rank)
      || (b.score - a.score)
      || (b.id - a.id);
  });
}

function renderJobList() {
  const list = $('#oppList');
  const rows = rankJobs(state.jobs.filter(passesFilters));
  const c = { suitable: 0, review: 0, excluded: 0 };
  for (const j of state.jobs) c[j.eligibility.bucket] = (c[j.eligibility.bucket] || 0) + 1;
  $('#oppCount').textContent = `${rows.length} shown · ${c.suitable} suitable · ${c.review} review · ${c.excluded} excluded`;
  if (!state.jobs.length) {
    list.innerHTML = `<li class="empty"><h3>No opportunities yet</h3>
      <span class="note">Capture hiring leads from your real Chrome session with the browser engine, or run a source scan.</span>
      <div class="row"><button class="btn btn-primary btn-sm" data-act="scan">Scan sources</button>
      <button class="btn btn-sm" data-act="capture">Capture from browser</button></div></li>`;
    return;
  }
  if (!rows.length) { list.innerHTML = `<li class="empty"><h3>Nothing matches these filters</h3><div class="row"><button class="btn btn-sm" id="oppClear2">Clear filters</button></div></li>`; $('#oppClear2').onclick = () => { state.filters = { q:'',bucket:'',role:'',city:'',tier:'',remote:false }; render(); }; return; }
  list.innerHTML = rows.map(jobRow).join('');
}
function bucketPill(b) {
  const map = { suitable: ['good','Suitable'], review: ['warn','Review'], excluded: ['bad','Excluded'] };
  const [cls, label] = map[b] || ['', b];
  return `<span class="pill ${cls}">${label}</span>`;
}
function jobRow(j) {
  const e = j.eligibility, f = e.fit;
  const meta = [];
  if (j.company || j.author) meta.push(`<strong>${esc(j.company || j.author)}</strong>`);
  meta.push(esc(f.city.label));
  if (f.type.key === 'internship') meta.push('Internship' + (f.duration.stated ? ' · 4–6 mo' : ''));
  else if (f.type.confirmed) meta.push(esc(f.type.label));
  meta.push(esc(f.role.label));
  meta.push(ago(j.posted_at || j.first_seen_at));
  const flagged = e.reasons.filter((r) => r.level === 'excluded' || r.level === 'review').slice(0, 2);
  const reasons = flagged.length ? `<div class="ireasons">${flagged.map((r) => `<span class="${r.level === 'excluded' ? 'ex' : 'rv'}">${r.level === 'excluded' ? 'Excluded: ' : 'Review: '}</span>${esc(r.text)}`).join(' &nbsp; ')}</div>` : '';
  const primary = e.bucket === 'excluded' ? 'Review' : 'Open';
  return `<li class="item ${e.bucket === 'excluded' ? 'dim' : ''}" data-id="${j.id}">
    <span class="mark ${e.bucket}" title="${esc(e.bucket)}"></span>
    <div>
      <h3 class="ititle"><button data-act="detail">${esc(j.title || '(untitled)')}</button></h3>
      <div class="imeta">${meta.join('<span class="sep">·</span>')}</div>
      ${reasons}
    </div>
    <div class="iactions">
      <span class="pill fit" title="Fit score">${j.score}</span>
      ${bucketPill(e.bucket)}
      <button class="btn btn-sm" data-act="detail">${primary}</button>
    </div></li>`;
}

  if (!state.research.length) { list.innerHTML = '<li class="empty"><h3>No research runs yet</h3><span class="note">Create one above to generate targeted queries.</span></li>'; return; }
  list.innerHTML = state.research.map((run) => {
    const steps = (run.steps || []).map((s) => `
      <div class="step">
        <span class="st">${esc(s.status)}</span>
        <div style="flex:1">
          <div><strong>${esc(s.label)}</strong> <span class="note mono">${esc((s.url || '').slice(0, 70))}</span></div>
          ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
        </div>
        <div class="iactions">
          ${s.status !== 'done' ? `<button class="btn btn-sm" data-rstep-open="${s.id}" data-run="${run.id}">Open</button>` : ''}
          <button class="btn btn-sm" data-rstep-ok="${s.id}" data-run="${run.id}">Found</button>
          <button class="btn btn-sm" data-rstep-skip="${s.id}" data-run="${run.id}">Skip</button>
        </div>
      </div>`).join('');
    const ctrl = run.status === 'active'
      ? `<button class="btn btn-sm" data-rstatus="paused" data-run="${run.id}">Pause</button>`
      : run.status === 'paused' ? `<button class="btn btn-sm" data-rstatus="active" data-run="${run.id}">Resume</button>` : '';
    return `<li class="item" style="grid-template-columns:1fr">
      <div>
        <div class="spread">
          <h3 class="ititle">${esc(run.role || 'research')} · ${esc(run.city || '')}${run.employer ? ' · ' + esc(run.employer) : ''}</h3>
          <div class="iactions"><span class="pill">${esc(run.status)}</span>${ctrl}
            <button class="btn btn-sm" data-rstatus="completed" data-run="${run.id}">Complete</button>
            <button class="btn btn-sm" data-rstatus="cancelled" data-run="${run.id}">Cancel</button></div>
        </div>
        <div style="margin-top:8px">${steps || '<span class="note">No steps.</span>'}</div>
      </div></li>`;
  }).join('');

  list.querySelectorAll('[data-rstep-open]').forEach((b) => b.onclick = async () => {
    b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    try { const r = await api(`/api/research/runs/${b.dataset.run}/step/${b.dataset.rstepOpen}/open`, { method: 'POST' }); toast('Opened in Chrome' + (r.tabId ? ' (tab ' + r.tabId + ')' : '')); await loadResearch(); renderResearchList(); }
    catch (e) { toast('Could not open: ' + esc(e.message)); b.disabled = false; b.textContent = 'Open'; }
  });
  list.querySelectorAll('[data-rstep-ok]').forEach((b) => b.onclick = () => setStep(b.dataset.run, b.dataset.rstepOk, 'done'));
  list.querySelectorAll('[data-rstep-skip]').forEach((b) => b.onclick = () => setStep(b.dataset.run, b.dataset.rstepSkip, 'skipped'));
  list.querySelectorAll('[data-rstatus]').forEach((b) => b.onclick = async () => {
    try { await api(`/api/research/runs/${b.dataset.run}/status`, { method: 'POST', body: JSON.stringify({ status: b.dataset.rstatus }) }); await loadResearch(); renderResearchList(); }
    catch (e) { toast(esc(e.message)); }
  });
}
async function setStep(runId, stepId, status) {
  let note = '';
  if (status === 'done') note = window.prompt('Optional note (what did you find?)') || '';
  try { await api(`/api/research/runs/${runId}/step/${stepId}/result`, { method: 'POST', body: JSON.stringify({ status, note }) }); await loadResearch(); renderResearchList(); }
  catch (e) { toast(esc(e.message)); }
}

/* -------- legacy sheet import (kept compatible) -------- */
const HEADER_MAPS = {
  target: [['company', ['company','company name','employer','org','firm','name']],['grade',['grade','tier','band']],['roles',['roles','role','role families','function']],['cities',['cities','city','location']],['djsce',['djsce']],['spit',['spit']],['kjseePlaced',['kjsce placed','placed']],['kjseeVisit',['kjsce visit','campus visit']],['cameThisYear',['came this year','came']],['notes',['notes','remarks']]],
  outreach: [['company',['company','employer','org']],['contact',['contact','name','recruiter','person']],['title',['title','role','designation']],['link',['link','profile','url','source']],['confidence',['confidence','verified']],['angle',['angle','approach']],['draft',['draft','message']],['status',['status']],['email',['email','mail']]],
  role: [['role',['role','family','function']],['companies',['companies','employers']],['cities',['cities','location']],['skills',['skills','stack']],['notes',['notes']]],
};
const normKey = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function parseDelimited(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n').filter((l) => l.trim() !== '');
  if (!lines.length) return { headers: [], rows: [] };
  const tabs = (lines[0].match(/\t/g) || []).length, commas = (lines[0].match(/,/g) || []).length;
  const delim = tabs >= commas && tabs > 0 ? '\t' : ',';
  const parseLine = (line) => {
    if (delim === '\t') return line.split('\t');
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch;
    }
    out.push(cur); return out;
  };
  return { headers: parseLine(lines[0]).map((h) => h.trim()), rows: lines.slice(1).map(parseLine) };
}
function openImport() {
  openModal({
    title: 'Import from your sheet',
    body: `<p class="note">Paste tab-separated or CSV rows (include the header row). Records stay local.</p>
      <label>Destination<select id="impKind"><option value="target">Company targets</option><option value="outreach">Contacts</option><option value="role">Roles</option></select></label>
      <label>Rows<textarea id="impText" rows="6" spellcheck="false"></textarea></label><div id="impPrev"></div>`,
    actions: [{ label: 'Preview', onClick: () => previewImport() },
      { label: 'Save', primary: true, onClick: async () => {
        const parsed = apiImport(); if (!parsed) return toast('Nothing to import.');
        const records = parsed.records.filter((r) => r.key || Object.keys(r.data).length);
        try { const res = await api('/api/workbook/import', { method: 'POST', body: JSON.stringify({ kind: parsed.kind, records }) }); closeModal(); toast(`Imported ${res.total} record(s).`); await Promise.all([loadCompanies(), loadContacts()]); render(); }
        catch (e) { toast('Import failed: ' + esc(e.message)); }
      } }],
  });
}
function apiImport() {
  const kind = $('#impKind').value;
  const { headers, rows } = parseDelimited($('#impText').value);
  if (!headers.length) return null;
  const fields = HEADER_MAPS[kind] || [];
  const map = headers.map((h) => { const nk = normKey(h); for (const [f, syns] of fields) if (syns.includes(nk)) return f; return null; });
  const records = [];
  for (const cells of rows) {
    const data = {}; headers.forEach((h, i) => { const f = map[i]; const v = cells[i] == null ? '' : String(cells[i]).trim(); if (f && v) data[f] = v; });
    const key = String(data.company || data.contact || data.role || '').trim();
    records.push({ key, data });
  }
  return { kind, records, headers, map };
}
function previewImport() {
  const p = apiImport();
  if (!p) { $('#impPrev').innerHTML = '<div class="banner warn">Paste rows first.</div>'; return; }
  const ok = p.records.filter((r) => r.key || Object.keys(r.data).length);
  $('#impPrev').innerHTML = `<div class="note" style="margin-top:8px">${ok.length} row(s) ready · ${p.map.filter(Boolean).length} headers mapped</div>`;
}

      <button class="btn btn-sm" data-bw="get-html">Get HTML</button>
      <button class="btn btn-sm" data-bw="reload">Reload</button>
      <button class="btn btn-sm" data-bw="back">Back</button>
      <button class="btn btn-sm" data-bw="forward">Forward</button>
      <button class="btn btn-sm" data-bw="release">Release tab</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="bwNav" placeholder="https://…" style="flex:1" />
      <button class="btn btn-sm" data-bw="navigate">Navigate</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="bwRef" placeholder="ref (from snapshot)" style="width:130px" />
      <input id="bwType" placeholder="text to type" style="flex:1" />
      <button class="btn btn-sm" data-bw="click">Click</button>
      <button class="btn btn-sm" data-bw="type">Type</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="bwKey" placeholder="key (Enter, Shift+Tab…)" style="width:150px" />
      <select id="bwDir"><option>down</option><option>up</option><option>left</option><option>right</option></select>
      <input id="bwAmt" type="number" placeholder="600" style="width:80px" />
      <button class="btn btn-sm" data-bw="key">Press key</button>
      <button class="btn btn-sm" data-bw="scroll">Scroll</button>
      <button class="btn btn-sm" data-bw="wait">Wait 500ms</button>
    </div>
    <div id="bwOut" style="margin-top:12px"></div>`;
  $('#bwOut').innerHTML = '<p class="note">Read from a tab with Snapshot or Screenshot.</p>';
  $('#modalBody').querySelectorAll('[data-bw]').forEach((b) => b.onclick = () => browserWsAction(b.dataset.bw));
}
function bwTabId() { const el = $('#bwTab'); return el ? Number(el.value) : null; }
const BW_READ = new Set(['snapshot', 'screenshot', 'get-html']);
function browserWsCall(tool, args, preview) {
  return api('/api/browsy/call', { method: 'POST', body: JSON.stringify({ tool, arguments: args, preview, confirmed: !preview }) });
}
async function browserWsAction(kind) {
  const out = $('#bwOut');
  const tabId = bwTabId();
  const map = {
    snapshot: ['browser_snapshot', { tabId }, 'read'],
    screenshot: ['browser_screenshot', { tabId }, 'read'],
    'get-html': ['browser_get_html', { tabId }, 'read'],
    reload: ['browser_reload', { tabId }, 'mut'],
    back: ['browser_back', { tabId }, 'mut'],
    forward: ['browser_forward', { tabId }, 'mut'],
    release: ['browser_release', { tabId }, 'mut'],
    navigate: ['browser_navigate', { tabId, url: $('#bwNav').value.trim() }, 'mut'],
    click: ['browser_click', $('#bwRef').value ? { tabId, ref: $('#bwRef').value.trim() } : { tabId }, 'mut'],
    type: ['browser_type', { tabId, ref: $('#bwRef').value.trim() || undefined, text: $('#bwType').value }, 'mut'],
    key: ['browser_press_key', { tabId, key: $('#bwKey').value.trim() }, 'mut'],
    scroll: ['browser_scroll', { tabId, direction: $('#bwDir').value, amount: Number($('#bwAmt').value) || 600 }, 'mut'],
    wait: ['browser_wait', { tabId, milliseconds: 500 }, 'read'],
  };
  const [tool, args] = map[kind] || [];
  if (!tool) return;
  if (tabId == null || Number.isNaN(tabId)) return toast('Pick a tab first.');

  if (map[kind][2] === 'mut') {
    let p;
    try { p = await browserWsCall(tool, args, true); } catch (e) { return toast('Preview failed: ' + esc(e.message)); }
    if (!p.ok) return toast('Invalid action: ' + esc((p.errors || []).join('; ')));
    return openModal({ title: 'Confirm browser action', body: `<p>${esc(p.summary)}</p><pre class="mono">${esc(JSON.stringify(p.arguments, null, 2))}</pre>`,
      actions: [{ label: 'Cancel', onClick: () => { closeModal(); refreshBrowserWs(); } },
        { label: 'Run action', primary: true, onClick: async () => { closeModal(); await runBrowserWs(tool, args); } }] });
  }
  await runBrowserWs(tool, args);
}
async function runBrowserWs(tool, args) {
  const out = () => $('#bwOut');
  if (out()) out().innerHTML = '<p class="note"><span class="spin"></span> working…</p>';
  try {
    const r = await api('/api/browsy/call', { method: 'POST', body: JSON.stringify({ tool, arguments: args, confirmed: true }) });
    if (!out()) openBrowserWorkspaceReturn();
    renderBrowserWsResult(tool, r);
  } catch (e) {
    if (out()) out().innerHTML = `<div class="banner bad">${esc(e.message)}${e.needsInspection ? ' — take a fresh snapshot before acting again.' : ''}</div>`;
  }
}
function openBrowserWorkspaceReturn() {}
function renderBrowserWsResult(tool, r) {
  const out = $('#bwOut'); if (!out) { toast('Action ran.'); return; }
  let html = '';
  if (r.unknownOutcome) html += '<div class="banner warn">Outcome unknown (timeout or disconnect). Take a fresh snapshot before repeating.</div>';
  if (tool === 'browser_screenshot' && r.images && r.images.length) {
    html += `<img alt="screenshot" src="data:${r.images[0].mimeType};base64,${r.images[0].data}" />`;
  } else if (tool === 'browser_snapshot' && r.parsed && r.parsed.snapshot) {
    html += `<pre>${esc(r.parsed.snapshot.slice(0, 6000))}</pre>`;
  } else {
    html += `<pre>${esc((r.text || '').slice(0, 6000))}</pre>`;
  }
  out.innerHTML = html;
  refreshConnections();
}

/* -------- Clinqy workspace -------- */
async function clinicLook() {
  openModal({ title: 'Clinqy — look at the screen', body: '<p class="note"><span class="spin"></span> reading…</p>', actions: [{ label: 'Close', onClick: closeModal }] });
  try { const r = await api('/api/clinqy/look', { method: 'POST', body: JSON.stringify({ mode: 'page' }) }); $('#modalBody').innerHTML = `<pre>${esc((r.text || '').slice(0, 8000))}</pre>`; }
  catch (e) { $('#modalBody').innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
}
async function clinicStats() {
  openModal({ title: 'Clinqy — run statistics', body: '<p class="note"><span class="spin"></span> reading…</p>', actions: [{ label: 'Close', onClick: closeModal }] });
  try { const r = await api('/api/clinqy/stats?days=7'); $('#modalBody').innerHTML = `<pre>${esc((r.text || '').slice(0, 8000))}</pre>`; }
  catch (e) { $('#modalBody').innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
}
function clinicRun() {
  openModal({ title: 'Clinqy — run a native task', body: `
    <p class="note">A plain-language task Clinqy performs on your Mac with a visible cursor. It asks before paying, sending or submitting.</p>
    <label>Task<textarea id="cqTask" rows="3" placeholder="e.g. open the placements sheet and read me the first row"></textarea></label>
    <label class="row" style="margin-top:8px"><input type="checkbox" id="cqDry" checked /> dry-run (point at each step without doing it)</label>
    <label>Timeout (seconds)<input id="cqTimeout" type="number" value="120" min="1" max="900" /></label>
    <div id="cqOut"></div>`,
    actions: [{ label: 'Cancel', onClick: closeModal },
      { label: 'Preview', onClick: () => clinicPreview() },
      { label: 'Run', primary: true, onClick: () => clinicConfirm() }] });
}
async function clinicPreview() {
  const task = $('#cqTask').value.trim(); if (!task) return toast('Describe the task.');
  const p = await api('/api/clinqy/preview', { method: 'POST', body: JSON.stringify({ tool: 'clinqy_run', arguments: { task, dry: $('#cqDry').checked, timeout: Number($('#cqTimeout').value) || 120 } }) });
  $('#cqOut').innerHTML = p.ok ? `<div class="banner ok">${esc(p.summary)}</div>` : `<div class="banner bad">${esc((p.errors || []).join('; '))}</div>`;
}
async function clinicConfirm() {
  const task = $('#cqTask').value.trim(); if (!task) return toast('Describe the task.');
  const dry = $('#cqDry').checked, timeout = Number($('#cqTimeout').value) || 120;
  openModal({ title: 'Confirm native task', body: `<p>${dry ? 'Dry-run' : 'Run'}: “${esc(task)}” on your Mac (timeout ${timeout}s).</p>`,
    actions: [{ label: 'Back', onClick: clinicRun }, { label: dry ? 'Dry-run now' : 'Run now', primary: true, onClick: async () => {
      clinicRun(); $('#cqTask').value = task; $('#cqDry').checked = dry; $('#cqTimeout').value = timeout;
      $('#cqOut').innerHTML = '<p class="note"><span class="spin"></span> running… <button class="btn btn-sm" id="cqCancel">Cancel</button></p>';
      const cancelBtn = $('#cqCancel'); if (cancelBtn) cancelBtn.onclick = async () => { await api('/api/clinqy/cancel', { method: 'POST', body: '{}' }); toast('Cancellation requested.'); };
      try { const r = await api('/api/clinqy/run', { method: 'POST', body: JSON.stringify({ task, dry, timeout, confirmed: true }) }); $('#cqOut').innerHTML = `<pre>${esc((r.text || '').slice(0, 8000))}</pre>`; refreshConnections(); }
      catch (e) { $('#cqOut').innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; }
    } }] });
}

/* ------------------------------------------------------------ top actions */
function onTopAction(act) {
  if (act === 'scan') return doScan();
  if (act === 'capture') return openCapture();
  if (act === 'export') return openExport();
  if (act === 'digest') return openDigest();
  if (act === 'research-new') return renderResearch($('#main'));
  if (act === 'export-pipeline') return window.open('/api/export/pipeline.csv', '_blank');
  if (act === 'export-companies') return window.open('/api/export/companies.csv', '_blank');
  if (act === 'export-contacts') return window.open('/api/export/contacts.csv', '_blank');
  if (act === 'recheck') return refreshConnections(true).then(() => render());
  if (act === 'browser-workspace') return openBrowserWorkspace();
  if (act === 'clinqy-look') return clinicLook();
  if (act === 'clinqy-stats') return clinicStats();
  if (act === 'clinqy-run') return clinicRun();
}

/* ------------------------------------------------------------- global wiring */
function closeDrawer() {
  const d = $('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true');
  const o = $('#overlay'); o.classList.remove('show'); setTimeout(() => { o.hidden = true; }, 180);
  if (state.focusBefore && state.focusBefore.focus) state.focusBefore.focus();
}
$('#drawerClose').onclick = closeDrawer;
$('#overlay').onclick = closeDrawer;
$('#modalClose').onclick = closeModal;
$('#modalOverlay').onclick = closeModal;
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { if ($('#modal') && !$('#modal').hidden) return closeModal(); if ($('#drawer').classList.contains('open')) return closeDrawer(); }
  if (ev.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { ev.preventDefault(); $('#fq')?.focus(); }
});
$('#tabs').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-tab]'); if (!b) return;
  state.section = b.dataset.tab; render();
});
$('#topActions').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (b) onTopAction(b.dataset.act);
});
$('#main').addEventListener('click', (ev) => {
  const g = ev.target.closest('[data-goto]'); if (g) { state.section = g.dataset.goto; return render(); }
  const act = ev.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act === 'scan') return doScan();
  if (act.dataset.act === 'capture') return openCapture();
  const card = ev.target.closest('.item');
  if (card && ['detail','open'].includes(act.dataset.act)) return openJob(Number(card.dataset.id));
});
$('#main').addEventListener('keyup', (ev) => {
  if (ev.target.id === 'fq') { clearTimeout(window.__ft); window.__ft = setTimeout(() => { readFilters(); loadJobs(); }, 300); }
});

/* boot + polite polling */
boot();
setInterval(() => { if (!document.hidden) refreshState(); }, 5000);
</script>
